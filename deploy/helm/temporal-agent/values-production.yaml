global:
  namespace: temporal-agent
  environment: production

api:
  replicaCount: 3
  image:
    repository: ghcr.io/your-org/temporal-ai-agent
    tag: latest
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "100"
    hosts:
      - host: agent.example.com
        paths:
          - path: /
    tls:
      - secretName: agent-tls
        hosts:
          - agent.example.com
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

worker:
  replicaCount: 3
  image:
    repository: ghcr.io/your-org/temporal-ai-agent
    tag: latest
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20

config:
  nodeEnv: production
  agentMaxIterations: 25
  approvalTimeoutHours: 2

temporal:
  enabled: true
  server:
    replicaCount: 3

postgresql:
  enabled: false
