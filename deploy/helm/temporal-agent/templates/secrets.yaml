apiVersion: v1
kind: Secret
metadata:
  name: {{ include "temporal-agent.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "temporal-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | default "" | quote }}
  {{- if .Values.secrets.temporalClientCert }}
  TEMPORAL_CLIENT_CERT: {{ .Values.secrets.temporalClientCert | quote }}
  {{- end }}
  {{- if .Values.secrets.temporalClientKey }}
  TEMPORAL_CLIENT_KEY: {{ .Values.secrets.temporalClientKey | quote }}
  {{- end }}
