apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "temporal-agent.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "temporal-agent.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  TEMPORAL_ADDRESS: {{ .Values.config.temporalAddress | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.config.temporalNamespace | quote }}
  AGENT_MAX_ITERATIONS: {{ .Values.config.agentMaxIterations | quote }}
  APPROVAL_TIMEOUT_HOURS: {{ .Values.config.approvalTimeoutHours | quote }}
  WORKSPACE_DIR: {{ .Values.config.workspaceDir | quote }}
