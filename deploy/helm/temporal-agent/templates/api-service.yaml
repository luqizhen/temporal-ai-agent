apiVersion: v1
kind: Service
metadata:
  name: {{ include "temporal-agent.fullname" . }}-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "temporal-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "temporal-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
